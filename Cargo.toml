[package]
name = "rust-project"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
axum-macros = "0.4"
dotenvy = "0.15.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = "1"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
